name: Gem release

on:
  workflow_call:
    inputs:
      gem:
        description: RubyGems gem name
        required: true
        type: string
      ruby-version:
        description: Ruby used to evaluate, build and publish the gem
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.prepare.outputs.release }}
      version: ${{ steps.prepare.outputs.version }}
      notes: ${{ steps.prepare.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # job.workflow_* identifies this reusable workflow, not its caller.
      - uses: actions/checkout@v5
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-workflow
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
      - id: prepare
        name: Check the effective gem version and changelog
        run: ruby .release-workflow/script/gem_release.rb "$GEM" "$BASE_SHA" "$HEAD_SHA"
        env:
          GEM: ${{ inputs.gem }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.event.inputs.previous-ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  publish:
    needs: prepare
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      # Default checkout keeps main attached at the event SHA for Bundler's release task.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true
      - uses: rubygems/release-gem@v1
      - name: Publish the GitHub release from CHANGELOG.md
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_NOTES: ${{ needs.prepare.outputs.notes }}
